<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nask VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="margin:0;padding:0;font-family:sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;">
    <div style="max-width:480px;margin:0 auto;padding:20px;">
        <div style="text-align:center;padding:20px 0;">
            <div style="font-size:32px;font-weight:700;color:#667eea;">Nask VPN</div>
            <div style="color:#999;margin-top:8px;">Быстрый и безопасный VPN</div>
        </div>
        
        <div style="background:#1a1a1a;border-radius:16px;padding:20px;margin-bottom:16px;">
            <h3 style="margin:0 0 12px 0;">🎁 Пробный период</h3>
            <div onclick="selectPlan('trial', this)" style="display:flex;justify-content:space-between;padding:14px;background:#222;border-radius:12px;cursor:pointer;">
                <span>1 день</span>
                <span style="color:#667eea;">Бесплатно</span>
            </div>
        </div>
        
        <div style="background:#1a1a1a;border-radius:16px;padding:20px;margin-bottom:16px;">
            <h3 style="margin:0 0 12px 0;">📅 Подписка</h3>
            <div onclick="selectPlan('1_month', this)" style="display:flex;justify-content:space-between;padding:14px;background:#222;border-radius:12px;margin-bottom:8px;cursor:pointer;">
                <span>1 месяц</span>
                <span style="color:#667eea;">50 ⭐</span>
            </div>
            <div onclick="selectPlan('3_months', this)" style="display:flex;justify-content:space-between;padding:14px;background:#222;border-radius:12px;margin-bottom:8px;cursor:pointer;">
                <span>3 месяца (−35%)</span>
                <span style="color:#667eea;">100 ⭐</span>
            </div>
            <div onclick="selectPlan('6_months', this)" style="display:flex;justify-content:space-between;padding:14px;background:#222;border-radius:12px;margin-bottom:8px;cursor:pointer;">
                <span>6 месяцев (−50%)</span>
                <span style="color:#667eea;">150 ⭐</span>
            </div>
            <div onclick="selectPlan('12_months', this)" style="display:flex;justify-content:space-between;padding:14px;background:#222;border-radius:12px;cursor:pointer;">
                <span>12 месяцев (−67%)</span>
                <span style="color:#667eea;">200 ⭐</span>
            </div>
        </div>
        
        <button id="btn" onclick="activate()" disabled style="width:100%;padding:14px;background:#667eea;border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;opacity:0.5;">
            Выберите тариф
        </button>
        
        <div style="text-align:center;color:#999;margin-top:20px;">
            💬 Поддержка: @NaskSupport
        </div>
    </div>
    
    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        let selected = null;
        
        function selectPlan(planId, element) {
            selected = planId;
            
            // Убираем выделение
            document.querySelectorAll('[onclick^="selectPlan"]').forEach(el => {
                el.style.border = 'none';
            });
            
            // Выделяем выбранный
            element.style.border = '2px solid #667eea';
            
            // Активируем кнопку
            let btn = document.getElementById('btn');
            btn.disabled = false;
            btn.style.opacity = '1';
            
            let names = {
                'trial': '🎁 Пробный (1 день)',
                '1_month': '📅 1 месяц',
                '3_months': '📅 3 месяца',
                '6_months': '📅 6 месяцев',
                '12_months': '📅 12 месяцев'
            };
            
            btn.textContent = 'Активировать: ' + names[planId];
        }
        
        function activate() {
            if (!selected) return;
            
            let data = JSON.stringify({plan_id: selected});
            
            // Отправляем данные
            tg.sendData(data);
            
            // Закрываем
            tg.close();
        }
    </script>
</body>
</html>
