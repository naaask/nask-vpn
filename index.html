<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nask VPN</title>
</head>
<body style="margin:0;padding:0;font-family:sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;">
    <div style="max-width:480px;margin:0 auto;padding:20px;">
        <div style="text-align:center;padding:20px 0;">
            <div style="font-size:32px;font-weight:700;color:#667eea;">Nask VPN</div>
            <div style="color:#999;margin-top:8px;">Быстрый и безопасный VPN</div>
        </div>
        
        <div style="background:#1a1a1a;border-radius:16px;padding:20px;margin-bottom:16px;">
            <h3 style="margin:0 0 12px 0;">🎁 Пробный период</h3>
            <button onclick="activate('trial')" style="width:100%;display:flex;justify-content:space-between;padding:14px;background:#222;border:none;border-radius:12px;cursor:pointer;color:#fff;font-size:16px;">
                <span>1 день</span>
                <span style="color:#667eea;">Бесплатно</span>
            </button>
        </div>
        
        <div style="background:#1a1a1a;border-radius:16px;padding:20px;margin-bottom:16px;">
            <h3 style="margin:0 0 12px 0;">📅 Подписка</h3>
            <button onclick="activate('1_month')" style="width:100%;display:flex;justify-content:space-between;padding:14px;background:#222;border:none;border-radius:12px;margin-bottom:8px;cursor:pointer;color:#fff;font-size:16px;">
                <span>1 месяц</span>
                <span style="color:#667eea;">50 ⭐</span>
            </button>
            <button onclick="activate('3_months')" style="width:100%;display:flex;justify-content:space-between;padding:14px;background:#222;border:none;border-radius:12px;margin-bottom:8px;cursor:pointer;color:#fff;font-size:16px;">
                <span>3 месяца (−35%)</span>
                <span style="color:#667eea;">100 ⭐</span>
            </button>
            <button onclick="activate('6_months')" style="width:100%;display:flex;justify-content:space-between;padding:14px;background:#222;border:none;border-radius:12px;margin-bottom:8px;cursor:pointer;color:#fff;font-size:16px;">
                <span>6 месяцев (−50%)</span>
                <span style="color:#667eea;">150 ⭐</span>
            </button>
            <button onclick="activate('12_months')" style="width:100%;display:flex;justify-content:space-between;padding:14px;background:#222;border:none;border-radius:12px;cursor:pointer;color:#fff;font-size:16px;">
                <span>12 месяцев (−67%)</span>
                <span style="color:#667eea;">200 ⭐</span>
            </button>
        </div>
        
        <div style="text-align:center;color:#999;margin-top:20px;">
            💬 Поддержка: @NaskSupport
        </div>
    </div>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        function activate(planId) {
            if (!window.Telegram || !window.Telegram.WebApp) {
                alert('Telegram WebApp не загружен');
                return;
            }
            
            const data = JSON.stringify({
                plan_id: planId
            });
            
            window.Telegram.WebApp.sendData(data);
            window.Telegram.WebApp.close();
        }
    </script>
</body>
</html>
