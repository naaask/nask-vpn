<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nask VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="margin:0;padding:0;font-family:sans-serif;background:#0a0a0a;color:#fff;">
    <div style="max-width:480px;margin:0 auto;padding:20px;">
        <h2 style="text-align:center;color:#667eea;">Nask VPN</h2>
        
        <p style="text-align:center;color:#999;margin-bottom:20px;">Выберите тариф:</p>
        
        <a href="javascript:void(0)" onclick="choose('trial')" style="display:block;background:#1a1a1a;padding:15px;border-radius:10px;margin-bottom:10px;text-decoration:none;color:#fff;text-align:center;">
            🎁 Пробный — 1 день (Бесплатно)
        </a>
        
        <a href="javascript:void(0)" onclick="choose('1_month')" style="display:block;background:#1a1a1a;padding:15px;border-radius:10px;margin-bottom:10px;text-decoration:none;color:#fff;text-align:center;">
            📅 1 месяц — 50 ⭐
        </a>
        
        <a href="javascript:void(0)" onclick="choose('3_months')" style="display:block;background:#1a1a1a;padding:15px;border-radius:10px;margin-bottom:10px;text-decoration:none;color:#fff;text-align:center;">
            📅 3 месяца — 100 ⭐ (−35%)
        </a>
        
        <a href="javascript:void(0)" onclick="choose('6_months')" style="display:block;background:#1a1a1a;padding:15px;border-radius:10px;margin-bottom:10px;text-decoration:none;color:#fff;text-align:center;">
            📅 6 месяцев — 150 ⭐ (−50%)
        </a>
        
        <a href="javascript:void(0)" onclick="choose('12_months')" style="display:block;background:#1a1a1a;padding:15px;border-radius:10px;margin-bottom:20px;text-decoration:none;color:#fff;text-align:center;">
            📅 12 месяцев — 200 ⭐ (−67%)
        </a>
        
        <p style="text-align:center;color:#999;">💬 @NaskSupport</p>
    </div>
    
    <script>
        console.log('Script loaded');
        
        function choose(planId) {
            console.log('Plan selected: ' + planId);
            
            if (window.Telegram && window.Telegram.WebApp) {
                console.log('Telegram WebApp available');
                
                window.Telegram.WebApp.sendData(
                    JSON.stringify({plan_id: planId})
                );
                
                console.log('Data sent');
                
                setTimeout(function() {
                    window.Telegram.WebApp.close();
                }, 500);
            } else {
                console.log('Telegram WebApp NOT available');
                alert('Выбран тариф: ' + planId);
            }
        }
    </script>
</body>
</html>
