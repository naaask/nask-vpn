<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nask VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="margin:0;padding:0;font-family:sans-serif;background:#0a0a0a;color:#fff;">
    <div style="max-width:480px;margin:0 auto;padding:20px;">
        <h2 style="text-align:center;color:#667eea;">Nask VPN</h2>
        <p style="text-align:center;color:#999;margin-bottom:20px;">Выберите тариф:</p>
        
        <button onclick="choose('trial')" style="display:block;width:100%;background:#1a1a1a;padding:15px;border-radius:10px;margin-bottom:10px;border:none;color:#fff;font-size:16px;cursor:pointer;">
            🎁 Пробный — 1 день (Бесплатно)
        </button>
        <button onclick="choose('1_month')" style="display:block;width:100%;background:#1a1a1a;padding:15px;border-radius:10px;margin-bottom:10px;border:none;color:#fff;font-size:16px;cursor:pointer;">
            📅 1 месяц — 50 ⭐
        </button>
        <button onclick="choose('3_months')" style="display:block;width:100%;background:#1a1a1a;padding:15px;border-radius:10px;margin-bottom:10px;border:none;color:#fff;font-size:16px;cursor:pointer;">
            📅 3 месяца — 100 ⭐ (−35%)
        </button>
        <button onclick="choose('6_months')" style="display:block;width:100%;background:#1a1a1a;padding:15px;border-radius:10px;margin-bottom:10px;border:none;color:#fff;font-size:16px;cursor:pointer;">
            📅 6 месяцев — 150 ⭐ (−50%)
        </button>
        <button onclick="choose('12_months')" style="display:block;width:100%;background:#1a1a1a;padding:15px;border-radius:10px;margin-bottom:20px;border:none;color:#fff;font-size:16px;cursor:pointer;">
            📅 12 месяцев — 200 ⭐ (−67%)
        </button>
        
        <p id="status" style="text-align:center;color:#999;min-height:20px;"></p>
        <p style="text-align:center;color:#999;">💬 @NaskSupport</p>
    </div>
    
    <script>
        const API_URL = 'https://cbs-fat-outline-capabilities.trycloudflare.com/api/create-invoice';
        const tg = window.Telegram && window.Telegram.WebApp;
        
        if (tg) {
            tg.ready();
            tg.expand();
        }
        
        function setStatus(text) {
            document.getElementById('status').textContent = text;
        }
        
        async function choose(planId) {
            if (!tg) {
                alert('Открой через Telegram-бота');
                return;
            }
            
            setStatus('Обработка...');
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        initData: tg.initData,
                        plan_id: planId
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    if (data.error === 'trial_used') {
                        setStatus('❌ Пробный период уже использован');
                    } else {
                        setStatus('❌ Ошибка');
                    }
                    return;
                }
                
                if (data.status === 'trial_activated') {
                    setStatus('✅ Готово! Проверьте чат с ботом.');
                    setTimeout(function() { tg.close(); }, 1500);
                    return;
                }
                
                if (data.invoice_link) {
                    tg.openInvoiceLink(data.invoice_link, function(status) {
                        if (status === 'paid') {
                            setStatus('✅ Оплата прошла!');
                            setTimeout(function() { tg.close(); }, 1500);
                        } else {
                            setStatus('Оплата отменена');
                        }
                    });
                }
            } catch (err) {
                setStatus('❌ Ошибка соединения');
            }
        }
    </script>
</body>
</html>
