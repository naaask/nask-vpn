<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nask VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            padding: 20px 0;
        }
        
        .logo {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: #999;
            margin-top: 8px;
            font-size: 14px;
        }
        
        .card {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #2a2a2a;
        }
        
        .card h3 {
            margin-bottom: 12px;
            font-size: 18px;
        }
        
        .plan {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            background: #222;
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }
        
        .plan:active {
            background: #333;
        }
        
        .plan.active {
            border: 2px solid #667eea;
            background: #2a2a3a;
        }
        
        .plan-name {
            font-weight: 500;
        }
        
        .plan-price {
            color: #667eea;
            font-weight: 600;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        .btn:active {
            opacity: 0.8;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .info {
            color: #999;
            font-size: 14px;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">Nask VPN</div>
            <div class="subtitle">Быстрый и безопасный VPN</div>
        </div>
        
        <div class="card">
            <h3>🎁 Пробный период</h3>
            <div class="plan" data-plan="trial">
                <span class="plan-name">1 день</span>
                <span class="plan-price">Бесплатно</span>
            </div>
        </div>
        
        <div class="card">
            <h3>📅 Подписка</h3>
            <div class="plan" data-plan="1_month">
                <span class="plan-name">1 месяц</span>
                <span class="plan-price">50 ⭐</span>
            </div>
            <div class="plan" data-plan="3_months">
                <span class="plan-name">3 месяца (−35%)</span>
                <span class="plan-price">100 ⭐</span>
            </div>
            <div class="plan" data-plan="6_months">
                <span class="plan-name">6 месяцев (−50%)</span>
                <span class="plan-price">150 ⭐</span>
            </div>
            <div class="plan" data-plan="12_months">
                <span class="plan-name">12 месяцев (−67%)</span>
                <span class="plan-price">200 ⭐</span>
            </div>
        </div>
        
        <button class="btn" id="activateBtn" disabled>
            Выберите тариф
        </button>
        
        <div class="info">
            💬 Поддержка: @NaskSupport
        </div>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        let selectedPlan = null;
        
        // Назначаем обработчики на все планы
        document.querySelectorAll('.plan').forEach(plan => {
            plan.addEventListener('click', function() {
                selectedPlan = this.dataset.plan;
                
                // Убираем выделение со всех
                document.querySelectorAll('.plan').forEach(el => {
                    el.classList.remove('active');
                });
                
                // Выделяем выбранный
                this.classList.add('active');
                
                // Активируем кнопку
                const btn = document.getElementById('activateBtn');
                btn.disabled = false;
                
                const planNames = {
                    'trial': '🎁 Пробный (1 день)',
                    '1_month': '📅 1 месяц',
                    '3_months': '📅 3 месяца',
                    '6_months': '📅 6 месяцев',
                    '12_months': '📅 12 месяцев'
                };
                
                btn.textContent = 'Активировать: ' + planNames[selectedPlan];
            });
        });
        
        // Обработчик кнопки
        document.getElementById('activateBtn').addEventListener('click', function() {
            if (!selectedPlan) return;
            
            const data = JSON.stringify({
                plan_id: selectedPlan
            });
            
            // Отправляем данные в бота
            tg.sendData(data);
            
            // Закрываем Mini App
            tg.close();
        });
    </script>
</body>
</html>
